name: Dependency Management

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        default: 'minor'
        type: choice
        options:
        - patch
        - minor
        - major
      auto_merge:
        description: 'Auto-merge if tests pass'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.22.x'

jobs:
  # Check for dependency updates
  dependency_check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      updates_json: ${{ steps.check.outputs.updates_json }}
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get current dependencies
      run: flutter pub get
      
    - name: Check for outdated packages
      id: check
      run: |
        # Get outdated packages
        flutter pub outdated --json > outdated.json
        
        # Check if there are any updates available
        if [ -s outdated.json ]; then
          # Parse the JSON to check for updates
          updates=$(cat outdated.json | jq -r '.packages[] | select(.latest != .current) | .name')
          if [ -n "$updates" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "updates_json=$(cat outdated.json | jq -c .)" >> $GITHUB_OUTPUT
            echo "Available updates:"
            echo "$updates"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_updates=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Upload outdated report
      uses: actions/upload-artifact@v3
      if: steps.check.outputs.has_updates == 'true'
      with:
        name: dependency-report-${{ github.run_id }}
        path: nutriplan_app/outdated.json

  # Update patch versions automatically
  update_patch:
    name: Update Patch Versions
    runs-on: ubuntu-latest
    needs: dependency_check
    if: needs.dependency_check.outputs.has_updates == 'true' && (inputs.update_type == 'patch' || github.event_name == 'schedule')
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Get current dependencies
      run: flutter pub get
      
    - name: Update patch versions
      run: |
        # Parse outdated.json to identify patch updates
        echo '${{ needs.dependency_check.outputs.updates_json }}' > outdated.json
        
        # Extract packages that have patch updates available
        patch_updates=$(cat outdated.json | jq -r '.packages[] | select(.latest != .current and (.latest | split(".")[0:2] == (.current | split(".")[0:2]))) | .name')
        
        if [ -n "$patch_updates" ]; then
          echo "Updating patch versions for: $patch_updates"
          
          # Update each package
          for package in $patch_updates; do
            latest_version=$(cat outdated.json | jq -r ".packages[] | select(.name == \"$package\") | .latest")
            echo "Updating $package to $latest_version"
            
            # Update in pubspec.yaml
            sed -i "s/^  $package:.*/  $package: ^$latest_version/" pubspec.yaml
          done
          
          # Get updated dependencies
          flutter pub get
          
          # Regenerate code if needed
          flutter packages pub run build_runner build --delete-conflicting-outputs
          
          # Create commit
          git add .
          git commit -m "chore: update patch versions

Updated packages:
$patch_updates

Generated by automated dependency update workflow."
          
          # Create branch and push
          branch_name="chore/update-patch-deps-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch_name"
          git push origin "$branch_name"
          
          echo "PATCH_BRANCH=$branch_name" >> $GITHUB_ENV
        else
          echo "No patch updates available"
          echo "PATCH_BRANCH=" >> $GITHUB_ENV
        fi
        
    - name: Create Pull Request for Patch Updates
      if: env.PATCH_BRANCH != ''
      uses: actions/github-script@v6
      with:
        script: |
          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'chore: automated patch dependency updates',
            head: process.env.PATCH_BRANCH,
            base: 'develop',
            body: `
## Automated Dependency Updates (Patch Versions)

This PR contains automated updates for patch versions of dependencies.

### Changes
- Updated patch versions for outdated packages
- Regenerated code with build_runner
- All tests should pass before merging

### Safety
- Only patch version updates (no breaking changes expected)
- Automated testing will verify compatibility

### Next Steps
- Review the changes
- Ensure all tests pass
- Merge if everything looks good

---
*This PR was created automatically by the dependency management workflow.*
            `,
            draft: false
          });
          
          // Add labels
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: ['dependencies', 'automated', 'patch']
          });
          
          console.log(`Created PR #${pr.number}`);

  # Update minor versions with manual approval
  update_minor:
    name: Update Minor Versions
    runs-on: ubuntu-latest
    needs: dependency_check
    if: needs.dependency_check.outputs.has_updates == 'true' && inputs.update_type == 'minor'
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Update minor versions
      run: |
        echo '${{ needs.dependency_check.outputs.updates_json }}' > outdated.json
        
        # Extract packages that have minor updates available
        minor_updates=$(cat outdated.json | jq -r '.packages[] | select(.latest != .current and (.latest | split(".")[0] == (.current | split(".")[0]))) | .name')
        
        if [ -n "$minor_updates" ]; then
          echo "Updating minor versions for: $minor_updates"
          
          for package in $minor_updates; do
            latest_version=$(cat outdated.json | jq -r ".packages[] | select(.name == \"$package\") | .latest")
            echo "Updating $package to $latest_version"
            sed -i "s/^  $package:.*/  $package: ^$latest_version/" pubspec.yaml
          done
          
          flutter pub get
          flutter packages pub run build_runner build --delete-conflicting-outputs
          
          git add .
          git commit -m "chore: update minor versions

Updated packages:
$minor_updates"
          
          branch_name="chore/update-minor-deps-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch_name"
          git push origin "$branch_name"
          
          echo "MINOR_BRANCH=$branch_name" >> $GITHUB_ENV
        else
          echo "No minor updates available"
          echo "MINOR_BRANCH=" >> $GITHUB_ENV
        fi
        
    - name: Create Pull Request for Minor Updates
      if: env.MINOR_BRANCH != ''
      uses: actions/github-script@v6
      with:
        script: |
          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'chore: automated minor dependency updates',
            head: process.env.MINOR_BRANCH,
            base: 'develop',
            body: `
## Automated Dependency Updates (Minor Versions)

This PR contains automated updates for minor versions of dependencies.

### ⚠️ Review Required
Minor version updates may include new features and potential breaking changes.

### Changes
- Updated minor versions for outdated packages
- Regenerated code with build_runner

### Testing Required
- [ ] Run full test suite
- [ ] Manual testing of new features
- [ ] Verify no breaking changes

---
*This PR was created automatically by the dependency management workflow.*
            `,
            draft: true
          });
          
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: ['dependencies', 'automated', 'minor', 'review-required']
          });

  # Security vulnerability updates (immediate)
  security_updates:
    name: Security Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.update_type == 'security'
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Check for security vulnerabilities
      run: |
        flutter pub get
        
        # Check for known vulnerabilities
        flutter pub deps --json > deps.json
        
        # This would integrate with vulnerability databases
        # For now, we'll use audit tools that might be available
        echo "Checking for security vulnerabilities..."
        
    - name: Update vulnerable packages
      run: |
        # This would identify and update packages with known vulnerabilities
        # Implementation depends on available security scanning tools
        echo "Updating vulnerable packages..."
        
    - name: Create emergency security PR
      if: env.SECURITY_UPDATES != ''
      uses: actions/github-script@v6
      with:
        script: |
          // Create high-priority security update PR
          console.log('Creating security update PR...');

  # Dependency health check
  dependency_health:
    name: Dependency Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Analyze dependency health
      run: |
        flutter pub get
        flutter pub deps --json > deps.json
        
        echo "## Dependency Health Report" > health_report.md
        echo "Generated on: $(date)" >> health_report.md
        echo "" >> health_report.md
        
        # Count dependencies
        direct_deps=$(cat deps.json | jq '.packages[] | select(.kind == "direct")' | jq -s length)
        dev_deps=$(cat deps.json | jq '.packages[] | select(.kind == "dev")' | jq -s length)
        transitive_deps=$(cat deps.json | jq '.packages[] | select(.kind == "transitive")' | jq -s length)
        
        echo "### Dependency Statistics" >> health_report.md
        echo "- Direct dependencies: $direct_deps" >> health_report.md
        echo "- Dev dependencies: $dev_deps" >> health_report.md
        echo "- Transitive dependencies: $transitive_deps" >> health_report.md
        echo "" >> health_report.md
        
        # Check for duplicate dependencies
        echo "### Potential Issues" >> health_report.md
        duplicates=$(cat deps.json | jq -r '.packages[] | .name' | sort | uniq -d)
        if [ -n "$duplicates" ]; then
          echo "⚠️ Duplicate dependencies detected:" >> health_report.md
          echo "$duplicates" >> health_report.md
        else
          echo "✅ No duplicate dependencies found" >> health_report.md
        fi
        
        cat health_report.md >> $GITHUB_STEP_SUMMARY
        
    - name: Upload health report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-health-${{ github.run_id }}
        path: nutriplan_app/health_report.md

  # Notify about dependency status
  notify_status:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [dependency_check, update_patch, dependency_health]
    if: always() && github.event_name == 'schedule'
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#dependencies'
        fields: |
          {
            "title": "Dependency Management Report",
            "value": "Weekly dependency check completed",
            "short": false
          }
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}