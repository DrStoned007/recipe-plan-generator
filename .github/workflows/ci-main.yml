name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      skip_tests:
        description: 'Skip tests (emergency deployment only)'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.22.x'
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # Code Quality and Analysis
  code_quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate code (JSON serialization)
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Check for unused dependencies
      run: |
        flutter pub deps --json > deps.json
        # Add custom script to check for unused dependencies
        
    - name: Upload analysis results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: flutter-analysis.sarif
      continue-on-error: true

  # Security Scanning
  security_scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './nutriplan_app'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Dependency vulnerability scan
      run: |
        flutter pub deps --json | jq -r '.packages[] | select(.kind == "direct") | .name' > dependencies.txt
        # Add vulnerability scanning logic here
        
    - name: Secret detection scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # Comprehensive Testing Suite
  test_suite:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.skip_tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flutter-version: ['3.19.x', '3.22.x']
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Run unit tests
      run: |
        flutter test --coverage --reporter=github
        
    - name: Run widget tests
      run: |
        flutter test --coverage --reporter=github test/widget_test/
        
    - name: Run integration tests
      run: |
        flutter test integration_test/ --coverage
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./nutriplan_app/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        
    - name: Generate test reports
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Flutter Tests (${{ matrix.os }}, ${{ matrix.flutter-version }})
        path: test-results.json
        reporter: flutter-json

  # Build Artifacts for Multiple Platforms
  build_artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [code_quality, security_scan, test_suite]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            build-cmd: 'flutter build apk --release && flutter build appbundle --release'
          - target: ios
            os: macos-latest
            build-cmd: 'flutter build ios --release --no-codesign'
          - target: web
            os: ubuntu-latest
            build-cmd: 'flutter build web --release'
          - target: windows
            os: windows-latest
            build-cmd: 'flutter build windows --release'
          - target: macos
            os: macos-latest
            build-cmd: 'flutter build macos --release'
          - target: linux
            os: ubuntu-latest
            build-cmd: 'flutter build linux --release'
    
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Setup Java (Android)
      if: matrix.target == 'android'
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Android SDK (Android)
      if: matrix.target == 'android'
      uses: android-actions/setup-android@v3
      
    - name: Setup Xcode (iOS/macOS)
      if: matrix.target == 'ios' || matrix.target == 'macos'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install Linux dependencies
      if: matrix.target == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
        
    - name: Install Windows dependencies
      if: matrix.target == 'windows'
      run: |
        # Visual Studio Build Tools should be available on GitHub runners
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Configure build environment
      run: |
        flutter config --enable-web
        flutter config --enable-linux-desktop
        flutter config --enable-macos-desktop
        flutter config --enable-windows-desktop
        
    - name: Build ${{ matrix.target }}
      run: ${{ matrix.build-cmd }}
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.target }}-${{ github.sha }}
        path: |
          nutriplan_app/build/app/outputs/
          nutriplan_app/build/ios/
          nutriplan_app/build/web/
          nutriplan_app/build/windows/
          nutriplan_app/build/macos/
          nutriplan_app/build/linux/
        retention-days: 30

  # Performance and Bundle Analysis
  performance_analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: [build_artifacts]
    if: ${{ !failure() && !cancelled() }}
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: flutter packages pub run build_runner build --delete-conflicting-outputs
      
    - name: Build for analysis
      run: |
        flutter build web --release --analyze-size
        flutter build apk --release --analyze-size
        
    - name: Analyze bundle size
      run: |
        echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "### Web Build" >> $GITHUB_STEP_SUMMARY
        du -sh build/web/ >> $GITHUB_STEP_SUMMARY
        echo "### Android APK" >> $GITHUB_STEP_SUMMARY
        du -sh build/app/outputs/flutter-apk/ >> $GITHUB_STEP_SUMMARY
        
    - name: Performance benchmarks
      run: |
        # Add performance testing commands here
        echo "Performance benchmarks completed" >> $GITHUB_STEP_SUMMARY

  # Deployment Jobs
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build_artifacts, performance_analysis]
    if: |
      github.ref == 'refs/heads/develop' || 
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.nutriplan.app
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-web-${{ github.sha }}
        path: ./nutriplan_app/build/web
        
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment commands here
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here
        
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build_artifacts, performance_analysis]
    if: |
      github.ref == 'refs/heads/main' || 
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://nutriplan.app
    defaults:
      run:
        working-directory: ./nutriplan_app
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-web-${{ github.sha }}
        path: ./nutriplan_app/build/web
        
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add actual deployment commands here
        
    - name: Run production health checks
      run: |
        echo "Running production health checks..."
        # Add health check commands here
        
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}