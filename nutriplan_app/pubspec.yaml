name: nutriplan_app
description: "NutriPlan - A therapeutic diet meal planning application"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Backend & Database
  supabase_flutter: ^2.2.0
  
  # Authentication
  google_sign_in: ^6.2.1
  
  # UI & Navigation
  go_router: ^13.2.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  
  # Google Calendar Integration
  googleapis: ^13.1.0
  googleapis_auth: ^1.4.1
  
  # Local Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
